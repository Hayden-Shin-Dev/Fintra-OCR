[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fintraocr"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "numpy>=1.24,<3", "opencv-python-headless>=4.10,<5", "pycountry>=24.6", "tokenizers>=0.22,<0.24"]
[project.optional-dependencies]
ocr = ["paddleocr>=3.7,<4"]
cpu = ["paddlepaddle>=3,<4"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20"]
test = ["pytest>=8,<10", "fastapi>=0.115,<1", "python-multipart>=0.0.20", "httpx>=0.28", "Pillow>=10"]
[project.scripts]
fintraocr = "fintraocr.cli:main"
[tool.setuptools.packages.find]
include = ["fintraocr*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
fintraocr = ["static/*.html", "assets/*.json", "assets/*.txt", "assets/*.md"]
