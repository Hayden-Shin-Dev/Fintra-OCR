[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintra-ocr-v2"
version = "0.1.0"
description = "Evidence-first transaction review MVP built around the validated Fintra OCR runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
retrieval = ["numpy>=1.24", "faiss-cpu>=1.7.4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fintra*"]
