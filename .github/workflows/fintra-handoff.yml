name: Fintra OCR handoff validation
on:
  push:
    branches: [handoff/ocr-candidate110b-20260909]
    paths:
      - .github/workflows/fintra-handoff.yml
      - handoff/READY
permissions:
  contents: read
concurrency:
  group: fintra-ocr-handoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install code-test dependencies only
        run: python -m pip install -e ".[test]" build
      - name: Dependency check
        run: python -m pip check
      - name: Run repository tests (no GPU or live Ollama)
        shell: bash
        run: |
          mkdir -p handoff-validation
          set -o pipefail
          python -m pytest tests -q --junitxml=handoff-validation/tests.xml 2>&1 | tee handoff-validation/pytest.txt
      - name: Run handoff integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest handoff/test_integration.py -q --junitxml=handoff-validation/integration.xml 2>&1 | tee handoff-validation/integration.txt
      - name: Build installable wheel
        if: success()
        run: python -m build --wheel
      - name: Test actual installer in a fresh environment (no models)
        if: success()
        run: python handoff/verify_installer.py
      - name: Record environment and commit
        if: always()
        shell: bash
        run: |
          mkdir -p handoff-validation
          python -m pip freeze > handoff-validation/installed.txt
          git rev-parse HEAD > handoff-validation/commit.txt
          python -VV > handoff-validation/python.txt
      - name: Build handoff archive and replay all three document contracts
        if: ${{ success() && runner.os == 'Linux' }}
        run: python handoff/build_bundle.py
      - name: Upload teammate delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ success() && runner.os == 'Linux' }}
        with:
          name: FintraOCR-Team-Handoff
          path: handoff-dist/FintraOCR_Team_Handoff/
          retention-days: 7
          if-no-files-found: error
      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fintra-handoff-${{ runner.os }}-${{ github.run_number }}
          path: handoff-validation/
          retention-days: 1
          if-no-files-found: error
